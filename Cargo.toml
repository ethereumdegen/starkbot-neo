[workspace]
resolver = "3"
members = ["crates/*", "src-tauri", "spikes/s1-nav", "spikes/s4-voice", "spikes/s5-sol", "spikes/s6-panel", "spikes/s7-render", "spikes/s7-webview"]
# `cargo run` with no arguments starts `neo`. The workspace has several
# binaries — the desktop shell and six spikes — so cargo refuses to pick one
# without this.
#
# It also narrows a bare `cargo build`, `cargo test` and `cargo clippy` to this
# one package and its dependencies. Whole-workspace commands therefore need
# `--workspace`, which is what CI already runs.
default-members = ["crates/neo-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.lints]
rust = { unsafe_code = "deny", unused_must_use = "deny" }
clippy = { unwrap_used = "deny", expect_used = "warn", dbg_macro = "deny", print_stdout = "deny", disallowed_methods = "deny", await_holding_lock = "deny" }

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.27"
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl", "no-serde-warnings"] } # The dropped warnings are all `#[serde(transparent)]` on newtypes, which ts-rs already renders transparently.
uuid = { version = "1", features = ["serde", "v4", "v7"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "serde-well-known"] }
url = { version = "2", features = ["serde"] }
http = "1"
# Named only to satisfy `rig::http_client::HttpClientExt`'s own bounds, which
# rig states in terms of `bytes::Bytes` and does not re-export.
bytes = "1"
zeroize = "1"
security-framework = "3"
# Linux secret storage (`neo-keys`): the Secret Service D-Bus API that
# gnome-keyring and KWallet both implement. Chosen over `keyring`, which would
# pull this same crate plus its own abstraction layer, and over `libsecret-sys`,
# which needs libsecret/libdbus headers at build time. `rt-async-io-crypto-rust`
# keeps the tree pure Rust (no OpenSSL) and its blocking API off tokio's
# executor; `crypto-rust` gives the DH-encrypted session, so a secret never
# crosses the bus in clear text.
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }
# Named directly only so `neo-keys` can tell "no Secret Service is running" —
# a `ServiceUnknown` D-Bus reply — apart from every other transport failure.
zbus = { version = "5", default-features = false }
# `flock` for the screen lease, through a safe API: the workspace denies
# `unsafe_code`, which rules out calling libc directly for it.
rustix = { version = "1", features = ["fs"] }
futures-core = "0.3"
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "=2.5.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "http2", "stream"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.9"
tempfile = "3"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
insta = "1"
wiremock = "0.6"
neo-cdp = { path = "crates/neo-cdp" }
neo-keys = { path = "crates/neo-keys" }
neo-core = { path = "crates/neo-core" }
neo-eval = { path = "crates/neo-eval" }
neo-agent = { path = "crates/neo-agent" }
neo-ax = { path = "crates/neo-ax" }
neo-judge = { path = "crates/neo-judge" }
neo-store = { path = "crates/neo-store" }
neo-tui = { path = "crates/neo-tui" }
neo-otel = { path = "crates/neo-otel" }
neo-voice = { path = "crates/neo-voice" }
jev-nav = { path = "crates/jev-nav" }
spice-framework = "0.2"
metalcraft = { version = "1.2.0", features = ["rig"] }
# `macos-private-api` is re-added per-crate under a macOS target block: the
# feature does not exist on Linux and would poison the build graph there.
# `macos-private-api` stays here rather than behind a macOS target
# section in each member: `tauri-build` validates the feature list
# against `tauri.conf.json`'s `macOSPrivateApi` by reading the plain
# `[dependencies]` table, so a target-gated feature reads as absent and
# fails the build on macOS. It costs a Linux build nothing — it toggles
# `tauri-runtime`/`tauri-runtime-wry` cfgs and pulls in no crates.
tauri = { version = "2.11.0", default-features = false, features = ["wry", "macos-private-api"] }
tauri-build = "2.5.6"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
s7-render = { path = "spikes/s7-render" }
command-fds = "0.3.3"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSImage", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSData", "NSArray", "NSEnumerator", "NSURL"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
core-graphics = "0.25"
audioadapter-buffers = "5.2"
cpal = "0.18"
earshot = "1.2"
hound = "3.5"
rtrb = "0.4"
rubato = "5"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.earshot]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
split-debuginfo = "packed"
panic = "unwind"
