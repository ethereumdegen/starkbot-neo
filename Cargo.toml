[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
# The M0 spikes are a nested workspace under `spikes/` (see `spikes/README.md`).
# They were members until they had answered their questions; keeping them made
# CI compile two extra Tauri apps, and — because none of them opted into
# `[lints] workspace = true` — did so with `unsafe_code = "deny"` never applied
# to a third of the workspace. Their conclusions are in `plans/spikes.md`.
exclude = ["spikes"]
# `cargo run` with no arguments starts `neo`. The workspace has more than one
# binary — `neo` and the desktop shell — so cargo refuses to pick one without
# this.
#
# It also narrows a bare `cargo build`, `cargo test` and `cargo clippy` to this
# one package and its dependencies. Whole-workspace commands therefore need
# `--workspace`, which is what CI already runs.
default-members = ["crates/neo-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.lints]
rust = { unsafe_code = "deny", unused_must_use = "deny" }
clippy = { unwrap_used = "deny", expect_used = "warn", dbg_macro = "deny", print_stdout = "deny", disallowed_methods = "deny", await_holding_lock = "deny" }

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.27"
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl", "no-serde-warnings"] } # The dropped warnings are all `#[serde(transparent)]` on newtypes, which ts-rs already renders transparently.
uuid = { version = "1", features = ["serde", "v4", "v7"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "serde-well-known"] }
url = { version = "2", features = ["serde"] }
http = "1"
# Named only to satisfy `rig::http_client::HttpClientExt`'s own bounds, which
# rig states in terms of `bytes::Bytes` and does not re-export.
bytes = "1"
zeroize = "1"
security-framework = "3"
# The login Keychain's Linux twin: whatever owns `org.freedesktop.secrets`
# on the session bus. `rt-tokio-crypto-rust` points its I/O at the reactor
# the rest of the workspace already runs on and keeps the session's
# Diffie-Hellman handshake on RustCrypto, for the reason `reqwest` here is
# on rustls: no C toolchain, one less system library to match.
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
# One zbus for the workspace. `neo-keys` asks the session bus whether a
# keyring provider exists, `neo-agent`'s doctor asks it for the two
# accessibility facts of 11, and L3's AT-SPI backend needs the same major —
# three independent `zbus = "5"` specs is how a duplicate-version finding
# starts. The runtime feature is `secret-service`'s to choose; only the API
# features each caller needs are named here.
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
# AT-SPI2 over the same zbus, in pure Rust: no `libatspi`, no GObject. The
# `tokio` feature points its `zbus::Connection` at the runtime `neo-ax`'s
# actor thread owns; `async-io` still arrives through `atspi-proxies`'
# non-optional zbus dependency, and zbus prefers tokio when both are on.
atspi = { version = "0.30", default-features = false, features = ["proxies", "connection", "wrappers", "tokio"] }
# The Wayland input fallback of 17 §3.3: `zwp_virtual_keyboard_v1` for keys
# and `zwlr_virtual_pointer_v1` for the pointer, spoken in-process. The
# alternative was spawning `xdotool` (X11-only) or `ydotool` (a root daemon
# on `/dev/uinput`), which P3 refuses.
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# `flock` for the screen lease, through a safe API: the workspace denies
# `unsafe_code`, which rules out calling libc directly for it.
rustix = { version = "1", features = ["fs"] }
futures-core = "0.3"
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "=2.5.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "http2", "stream"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.9"
tempfile = "3"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
insta = "1"
wiremock = "0.6"
neo-cdp = { path = "crates/neo-cdp" }
neo-keys = { path = "crates/neo-keys" }
neo-core = { path = "crates/neo-core" }
neo-eval = { path = "crates/neo-eval" }
neo-agent = { path = "crates/neo-agent" }
neo-ax = { path = "crates/neo-ax" }
neo-judge = { path = "crates/neo-judge" }
neo-store = { path = "crates/neo-store" }
neo-tui = { path = "crates/neo-tui" }
neo-otel = { path = "crates/neo-otel" }
neo-voice = { path = "crates/neo-voice" }
jev-nav = { path = "crates/jev-nav" }
spice-framework = "0.2"
metalcraft = { version = "1.2.0", features = ["rig"] }
# `macos-private-api` is not here: it is a macOS-only feature and the Linux
# shell (11.2 L4) links the same crate without it. `src-tauri` adds it back
# under its own macOS target table.
#
# Enabling it for every target instead makes `tauri-build` refuse the Linux
# build outright — the feature is on, `tauri.conf.json` never asks for the
# private API, and the allowlist check fails with "remove the
# `macos-private-api` feature" before a line of the shell compiles.
tauri = { version = "2.11.0", default-features = false, features = ["wry"] }
tauri-build = "2.5.6"
command-fds = "0.3.3"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSImage", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSData", "NSArray", "NSEnumerator", "NSURL"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
core-graphics = "0.25"
audioadapter-buffers = "5.2"
cpal = "0.18"
earshot = "1.2"
hound = "3.5"
rtrb = "0.4"
rubato = "5"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.earshot]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
split-debuginfo = "packed"
panic = "unwind"
