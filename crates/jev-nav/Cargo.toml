[package]
name = "jev-nav"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Jev-driven navigator: a Rust port of browser-use/jev-ultrafast (MIT). One TypeSafe request per step picks operation + target."
# An application crate, never a crates.io library.
publish = false

[lints]
workspace = true

[features]
# Native-app observation through the macOS Accessibility actor (05 §1, A23).
ax = ["neo-ax"]

[dependencies]
async-trait.workspace = true
neo-ax = { workspace = true, optional = true }
neo-cdp.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
wiremock.workspace = true
