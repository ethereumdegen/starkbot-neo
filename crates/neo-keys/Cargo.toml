[package]
name = "neo-keys"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Secret and credential vocabulary for Starkbot Neo."

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
zeroize.workspace = true

# The login Keychain is a Security-framework API and exists on macOS only.
# The file backend below it is pure Rust, so the crate — and therefore
# `neo-core` and `neo-store` — still builds and tests on the Linux CI lane.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
tempfile.workspace = true
