[package]
name = "neo-ax"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native accessibility actor: reads and drives native apps for the Jev navigator. macOS today; the AT-SPI backend is the Linux path."
# An application crate, never a crates.io library.
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = { version = "0.6.4", features = ["exception"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-application-services = { version = "0.3.2", default-features = false, features = [
    "HIServices",
    "std",
    "libc",
    "objc2",
    "AXError",
    "AXUIElement",
    "AXValue",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "CFArray",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "CFString",
    "CFURL",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSEnumerator",
    "NSString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "objc2",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi.workspace = true
futures-util.workspace = true
zbus.workspace = true
serde_json.workspace = true
rustix.workspace = true
wayland-client.workspace = true
wayland-protocols-misc.workspace = true
# The actor thread owns a current-thread runtime, so it needs the reactor
# `zbus`'s tokio transport and the walk's deadlines run on.
tokio = { version = "1", default-features = false, features = [
    "sync",
    "rt",
    "time",
    "net",
    "io-util",
] }

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync"] }
