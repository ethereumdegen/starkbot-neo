name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full workspace, with the Apple frameworks actually compiled in.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # The same workspace, on a runner that is ~10x cheaper and ~5x faster.
  #
  # Linux is a shipping platform (11.2 L0), not a subset any more: `neo-ax`
  # falls back to its `unsupported` backend until the AT-SPI one lands,
  # `neo-voice` has no on-device recogniser and says so, and the desktop
  # shell builds on webkit2gtk without the macOS private API. So this lane
  # runs the whole gate and catches a broken one in a minute rather than
  # behind a macOS queue.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # webkit2gtk, GTK and libsoup for the Tauri shell; `libxdo` for the
      # tray dependency it pulls in; ALSA headers for `cpal`'s capture
      # device. None of them are needed by `neo` itself.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libasound2-dev pkg-config
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # The webview half. `cargo test --workspace` runs the ts-rs
  # bindings-are-committed test, so *type* drift across the bridge is already
  # caught — but nothing type-checked or ran the TypeScript that consumes those
  # types until this job existed.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run

  # The rules `plans/05-platform.md` §1 says CI enforces. It previously claimed
  # to enforce 1, 3 and 4 and enforced none of them: the vendor-host grep
  # matched the provider modules themselves and so failed on every push.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Licences, advisories, duplicate versions and source registries. This
      # lived on the macOS job, where it could never have run: the action is a
      # Docker container action, and GitHub only supports those on Linux — it
      # failed with "Container action is only supported on Linux" every time.
      # `deny.toml` pins the graph to the two darwin triples and the Linux
      # one regardless of the host it is evaluated on, so nothing is lost by
      # moving it here.
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

      # Rule 4 — no Python, no shell agent surface (P3).
      - name: No Python
        run: |
          test -z "$(git ls-files '*.py')"
          ! git grep -nE '\bpython3?\b' -- ':!plans/**' ':!spikes/**' ':!**/*.md'

      # Rule 3, absolute half — a front end never names a vendor host (P12).
      - name: No vendor host in a front end
        run: |
          ! git grep -nE 'api\.openai\.com|api\.anthropic\.com|typesafe\.ai|fal\.run|quiver\.ai' \
            -- crates/neo-tui crates/neo-cli ui

      # Rule 3, allow-listed half — elsewhere, only the modules that hold a
      # credential may name the host it is sent to. `neo-agent/src/nav.rs` is
      # on this list because it holds the Jev endpoint constant; that constant
      # belongs in a provider module and the carve-out goes away when it moves.
      - name: No vendor host outside a provider module
        run: |
          ! git grep -nE 'api\.openai\.com|api\.anthropic\.com|typesafe\.ai|fal\.run|quiver\.ai' \
            -- ':!plans/**' ':!spikes/**' ':!**/*.md' \
               ':!crates/*/src/providers/**' \
               ':!crates/neo-agent/src/oauth/**' \
               ':!crates/neo-voice/src/stt/**' \
               ':!crates/neo-agent/src/nav.rs' \
               ':!crates/neo-agent/tests/live_*.rs'

      # Rule 1 — nothing below `src-tauri` depends on Tauri. The whole product
      # runs headless in `neo`. `cargo tree -i` exits non-zero when the package
      # is absent from that crate's graph, which is the passing case.
      - name: Nothing below src-tauri depends on Tauri
        run: |
          rustup show
          for manifest in crates/*/Cargo.toml; do
            crate="$(basename "$(dirname "$manifest")")"
            if cargo tree -p "$crate" -i tauri >/dev/null 2>&1; then
              echo "$crate depends on tauri; only src-tauri may (05 §1 rule 1)"
              exit 1
            fi
          done
