[package]
name = "neo-desktop"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Starkbot Neo desktop app shell (Tauri v2): the Connections screen (P12, K7)."
publish = false

[[bin]]
name = "neo-desktop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
neo-agent.workspace = true
neo-ax.workspace = true
neo-core.workspace = true
neo-eval.workspace = true
neo-otel.workspace = true
neo-store.workspace = true
neo-voice.workspace = true
serde.workspace = true
serde_json.workspace = true
# Tauri validates this literal dependency declaration against app config before
# Cargo target cfgs are applied. The feature is inert off macOS, so keeping it
# here preserves Linux builds while allowing the macOS window compositor API.
tauri = { workspace = true, features = ["macos-private-api"] }
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
ts-rs.workspace = true


[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
