[package]
name = "neo-desktop"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Starkbot Neo desktop app shell (Tauri v2): the Connections screen (P12, K7)."
publish = false

[[bin]]
name = "neo-desktop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
neo-agent.workspace = true
neo-ax.workspace = true
neo-core.workspace = true
neo-eval.workspace = true
neo-otel.workspace = true
neo-store.workspace = true
neo-voice.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
ts-rs.workspace = true

# The private-API window compositing this shell asks for in
# `tauri.macos.conf.json`. macOS-only by name and by effect; the Linux shell
# (11.2 L4) opens plain webkit2gtk windows.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { workspace = true, features = ["macos-private-api"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
