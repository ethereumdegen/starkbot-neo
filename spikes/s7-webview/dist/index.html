<!doctype html><html><head><meta charset="utf-8"><title>WebKit engine drift</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px -apple-system,sans-serif;background:#18181f;color:#f5f5fa}.bar{height:48px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #363642}.engine{color:#b3a8ff}.stage{position:absolute;inset:48px 0 0;overflow:hidden}.stage iframe{width:1080px;height:1080px;border:0;transform:scale(.67);transform-origin:0 0;background:white}.status{margin-left:auto;color:#aaa}
</style></head><body><header class="bar"><strong>HYPERCANVAS</strong><span class="engine">WKWebView drift probe</span><span class="status">starting</span></header><main class="stage"></main><script>
const invoke=window.__TAURI__.core.invoke,status=document.querySelector('.status'),stage=document.querySelector('.stage');
const twoFrames=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
async function loadFrame(html){const frame=document.createElement('iframe');frame.setAttribute('sandbox','allow-same-origin');stage.replaceChildren(frame);await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html});await frame.contentDocument.fonts.ready;await twoFrames();return frame}
(async()=>{try{const bundle=await invoke('fixture_bundle');const measure=new Function('doc',`return (${bundle.metrics_expression})`);const fixtures=[];for(let index=0;index<bundle.fixtures.length;index++){const fixture=bundle.fixtures[index];status.textContent=`${index+1}/${bundle.fixtures.length} · ${fixture.id}`;const frame=await loadFrame(fixture.html);const doc=frame.contentDocument;const probe=doc.querySelector('[data-n]');probe.setAttribute('data-webkit-patched','yes');const patchConfirmed=probe.getAttribute('data-webkit-patched')==='yes';fixtures.push({id:fixture.id,patchConfirmed,nodes:measure(doc)});}status.textContent='complete';await twoFrames();await invoke('report',{report:{engine:'WKWebView',userAgent:navigator.userAgent,devicePixelRatio:devicePixelRatio,iframeSandbox:'allow-same-origin',fixtures}});}catch(error){status.textContent=String(error);await invoke('report',{report:{engine:'WKWebView',error:String(error),fixtures:[]}})}})();
</script></body></html>
