<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Starkbot HyperCanvas fidelity spike</title>
  <style>
    * { box-sizing: border-box }
    html, body, main, iframe { margin: 0; width: 1080px; height: 1080px; overflow: hidden }
    html, body { background: white }
    iframe { display: block; border: 0; background: white }
  </style>
</head>
<body>
  <main></main>
  <script>
    const invoke = window.__TAURI__.core.invoke;
    const stage = document.querySelector('main');
    const twoFrames = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    async function settleImages(doc) {
      await Promise.all([...doc.images].map(image => image.complete ? image.decode().catch(() => {}) : new Promise(resolve => {
        image.addEventListener('load', resolve, { once: true });
        image.addEventListener('error', resolve, { once: true });
      })));
    }

    async function loadFixture(html) {
      const frame = document.createElement('iframe');
      frame.setAttribute('sandbox', 'allow-same-origin');
      stage.replaceChildren(frame);
      await new Promise(resolve => {
        frame.onload = resolve;
        frame.srcdoc = html;
      });
      const doc = frame.contentDocument;
      await doc.fonts.ready;
      await settleImages(doc);
      for (const animation of doc.getAnimations()) {
        animation.pause();
        const duration = Number(animation.effect?.getComputedTiming().duration);
        animation.currentTime = Number.isFinite(duration) ? duration : 0;
      }
      await twoFrames();
      return frame;
    }

    (async () => {
      try {
        const bundle = await invoke('fixture_bundle');
        const measure = new Function('doc', `return (${bundle.metrics_expression})`);
        const fixtures = [];
        const captures = [];
        for (const fixture of bundle.fixtures) {
          document.title = `HyperCanvas · ${fixture.id}`;
          const frame = await loadFixture(fixture.html);
          const doc = frame.contentDocument;
          const probe = doc.querySelector('[data-n]');
          probe.setAttribute('data-webkit-patched', 'yes');
          const patchConfirmed = probe.getAttribute('data-webkit-patched') === 'yes';
          fixtures.push({ id: fixture.id, patchConfirmed, nodes: measure(doc) });
          if (bundle.capture_enabled) {
            captures.push(await invoke('capture_fixture', { id: fixture.id }));
          }
        }
        await invoke('report', {
          report: {
            engine: 'WKWebView',
            userAgent: navigator.userAgent,
            devicePixelRatio: devicePixelRatio,
            viewport: [innerWidth, innerHeight],
            fixtures,
            captures
          }
        });
      } catch (error) {
        document.title = `HyperCanvas failed: ${error}`;
        console.error(error);
        await invoke('report', { report: { engine: 'WKWebView', error: String(error) } });
      }
    })();
  </script>
</body>
</html>
