[package]
name = "s7-webview"
version = "0.0.0"
edition.workspace = true
publish = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
s7-render.workspace = true
tokio.workspace = true
image.workspace = true

# `macOSPrivateApi: true` in this spike's tauri.conf.json needs the matching
# cargo feature, and it is a macOS capability, so it is requested per-target
# rather than in the workspace dep (plan 16 §8.2, seam 4). macOS is unchanged.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-web-kit.workspace = true
