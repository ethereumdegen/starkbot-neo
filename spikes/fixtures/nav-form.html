<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Access request — fixture</title>
<style>body{font:16px system-ui;margin:24px;max-width:640px}label{display:block;margin:10px 0}
output{display:block;margin-top:12px;font:13px ui-monospace,monospace;color:#333}</style></head>
<body><h1>Access request</h1>
<p>Fill both fields and save the request. Saving records what the form held.</p>
<form id="f"><label>Full name <input id="name" type="text" autocomplete="off"></label>
<label>Work email <input id="email" type="email" autocomplete="off"></label>
<button type="submit">Save request</button></form>
<p id="status" aria-live="polite">Nothing saved yet.</p>
<output id="state"></output>
<script>
// The page's own record of what happened to it, mirrored into localStorage so
// the eval harness can read it back from a separate tab (a probe cannot attach
// to the tab the navigator drove). `try` because a file:// page has no storage:
// opening this fixture by hand still works, it just records in memory.
const q=id=>document.getElementById(id);
let mem={};
const record=(key,value)=>{let s=mem;try{s=JSON.parse(localStorage.getItem('neo-eval')||'{}')}catch(e){}
 s[key]=value;mem=s;try{localStorage.setItem('neo-eval',JSON.stringify(s))}catch(e){}
 q('state').value=JSON.stringify(s);};
q('f').addEventListener('submit',e=>{e.preventDefault();
 const name=q('name').value.trim(),email=q('email').value.trim();
 record('request',{name,email});
 q('status').textContent=`Saved for ${name||'(nobody)'}.`;});
</script></body></html>
