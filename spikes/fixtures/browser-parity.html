<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Browser parity fixture</title>
<style>
body{font:15px system-ui;margin:16px;max-width:1000px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{border:1px solid #bbb;border-radius:8px;padding:10px;min-height:110px}iframe{width:100%;height:105px;border:0}.editor{min-height:58px;border:1px solid #777;padding:8px}.scroller{height:92px;overflow-y:auto;border:1px solid #777}.row{height:38px;padding:8px}button,a{font:inherit}
</style></head><body>
<h1>Browser parity fixture</h1><div class="grid">
<section class="panel"><h2>Open shadow root</h2><shadow-form></shadow-form></section>
<section class="panel"><h2>Same-origin iframe</h2><iframe title="Embedded controls" src="frame.html"></iframe></section>
<section class="panel"><h2>Composer</h2><div class="editor" contenteditable="plaintext-only" role="textbox" aria-label="Draft message"></div><output id="editor-state"></output></section>
<section class="panel"><h2>Upload</h2><label for="asset">Campaign asset</label><input id="asset" type="file" hidden><output id="upload-state">No file</output></section>
<section class="panel"><h2>Nested scroll</h2><div class="scroller" aria-label="Result list"><div class="row">Result 1</div><div class="row">Result 2</div><div class="row">Result 3</div><div class="row">Result 4</div><div class="row">Result 5</div><div class="row">Result 6</div><div class="row">Result 7</div><div class="row">Result 8</div><div class="row">Result 9</div><div class="row">Result 10</div><div class="row">Result 11</div><div class="row">Result 12</div></div></section>
<section class="panel"><h2>Keyboard and popup</h2><label>Keyboard list <input id="keys" role="combobox" aria-label="Keyboard list"></label><output id="key-state">none</output><p><a id="popup" href="popup.html" target="_blank">Open owned popup</a></p></section>
</div>
<script>
customElements.define('shadow-form',class extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'}).innerHTML=`<label for="shadow-name">Shadow name</label><input id="shadow-name" type="text"><button id="shadow-save">Save shadow value</button><output id="shadow-state"></output>`;this.shadowRoot.getElementById('shadow-save').onclick=()=>this.shadowRoot.getElementById('shadow-state').value=this.shadowRoot.getElementById('shadow-name').value;}});
document.getElementById('asset').addEventListener('change',event=>document.getElementById('upload-state').value=event.target.files[0]?.name||'No file');
document.getElementById('keys').addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();document.getElementById('key-state').value='ArrowDown received';}});
</script></body></html>
