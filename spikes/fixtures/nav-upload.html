<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Asset intake — fixture</title>
<style>body{font:16px system-ui;margin:24px;max-width:640px}label{display:block;margin:10px 0}
output{display:block;margin-top:12px;font:13px ui-monospace,monospace;color:#333}</style></head>
<body><h1>Asset intake</h1>
<p>Attach the campaign asset. The first upload to a host is a confirm, so this
page also exercises the upload gate.</p>
<label for="asset">Campaign asset</label><input id="asset" type="file">
<p id="status" aria-live="polite">No file attached.</p>
<output id="state"></output>
<script>
const q=id=>document.getElementById(id);
let mem={};
const record=(key,value)=>{let s=mem;try{s=JSON.parse(localStorage.getItem('neo-eval')||'{}')}catch(e){}
 s[key]=value;mem=s;try{localStorage.setItem('neo-eval',JSON.stringify(s))}catch(e){}
 q('state').value=JSON.stringify(s);};
q('asset').addEventListener('change',event=>{
  const file=event.target.files[0];
  record('upload',file?{name:file.name,size:file.size}:null);
  q('status').textContent=file?`Attached ${file.name}.`:'No file attached.';
});
</script></body></html>
