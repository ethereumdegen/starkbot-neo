<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Shortcut arming — fixture</title>
<style>body{font:16px system-ui;margin:24px;max-width:640px}label{display:block;margin:10px 0}
output{display:block;margin-top:12px;font:13px ui-monospace,monospace;color:#333}</style></head>
<body><h1>Shortcut arming</h1>
<p>The shortcut field arms on the down arrow key only. There is no button:
typing text into it does nothing, and nothing else on the page arms it.</p>
<label>Shortcut field <input id="shortcut" autofocus autocomplete="off" aria-label="Shortcut field"></label>
<p id="status" aria-live="polite">Shortcut is not armed.</p>
<output id="state"></output>
<script>
const q=id=>document.getElementById(id);
let mem={};
const record=(key,value)=>{let s=mem;try{s=JSON.parse(localStorage.getItem('neo-eval')||'{}')}catch(e){}
 s[key]=value;mem=s;try{localStorage.setItem('neo-eval',JSON.stringify(s))}catch(e){}
 q('state').value=JSON.stringify(s);};
q('shortcut').addEventListener('keydown',event=>{
  if (event.key!=='ArrowDown') return;
  event.preventDefault();
  record('shortcut',{key:'ArrowDown',armed:true});
  q('status').textContent='Shortcut is armed.';
});
</script></body></html>
