<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Supplier directory — fixture</title>
<style>body{font:16px system-ui;margin:24px;max-width:680px}label{display:block;margin:10px 0}
.card{border:1px solid #ccc;border-radius:8px;padding:10px;margin:8px 0}
#detail[hidden]{display:none}
output{display:block;margin-top:12px;font:13px ui-monospace,monospace;color:#333}</style></head>
<body><h1>Supplier directory</h1>
<p>Two steps: run the search, then open a result. Opening a result records the
query that produced it, so a result opened without searching is visible.</p>
<form id="f"><label>City <input id="city" type="text" autocomplete="off"></label>
<button type="submit">Run search</button></form>
<p id="status" aria-live="polite">No search run.</p>
<div id="results"></div>
<div id="detail" hidden><h2 id="dname"></h2><p id="dmeta"></p></div>
<output id="state"></output>
<script>
const q=id=>document.getElementById(id);
let mem={};
const record=(key,value)=>{let s=mem;try{s=JSON.parse(localStorage.getItem('neo-eval')||'{}')}catch(e){}
 s[key]=value;mem=s;try{localStorage.setItem('neo-eval',JSON.stringify(s))}catch(e){}
 q('state').value=JSON.stringify(s);};
const suppliers=[{name:'Ferro Nord',city:'Bilbao',lead:'6 days'},{name:'Casa Metal',city:'Bilbao',lead:'11 days'},
 {name:'Norte Cables',city:'Porto',lead:'4 days'}];
let query=null;
q('f').addEventListener('submit',event=>{
  event.preventDefault();
  query=q('city').value.trim();
  const hits=suppliers.filter(s=>s.city.toLowerCase()===query.toLowerCase());
  q('results').innerHTML='';q('detail').hidden=true;
  q('status').textContent=`${hits.length} supplier(s) in ${query||'nowhere'}.`;
  for (const hit of hits){
    const card=document.createElement('div');card.className='card';
    const open=document.createElement('button');open.textContent=`Open ${hit.name}`;
    open.onclick=()=>{
      q('dname').textContent=hit.name;q('dmeta').textContent=`Lead time ${hit.lead} · ${hit.city}`;
      q('detail').hidden=false;document.title=`${hit.name} — Supplier directory`;
      record('opened',{name:hit.name,query,lead:hit.lead});
      q('status').textContent=`Opened ${hit.name}.`;
    };
    card.append(open);q('results').append(card);
  }
});
</script></body></html>
