<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Plan picker — fixture</title>
<style>body{font:16px system-ui;margin:24px;max-width:640px}label{display:block;margin:10px 0}
output{display:block;margin-top:12px;font:13px ui-monospace,monospace;color:#333}</style></head>
<body><h1>Plan picker</h1>
<p>Choosing an option in the dropdown is not enough; the choice is only
recorded once it is stored.</p>
<label>Seat plan <select id="plan">
<option value="">Choose a plan</option><option>Starter</option><option>Business</option><option>Enterprise</option>
</select></label>
<label>Billing period <select id="period">
<option>Monthly</option><option>Yearly</option>
</select></label>
<button id="store">Store plan choice</button>
<p id="status" aria-live="polite">No plan stored.</p>
<output id="state"></output>
<script>
const q=id=>document.getElementById(id);
let mem={};
const record=(key,value)=>{let s=mem;try{s=JSON.parse(localStorage.getItem('neo-eval')||'{}')}catch(e){}
 s[key]=value;mem=s;try{localStorage.setItem('neo-eval',JSON.stringify(s))}catch(e){}
 q('state').value=JSON.stringify(s);};
q('store').onclick=()=>{
  const plan=q('plan').value,period=q('period').value;
  record('plan',{plan,period});
  q('status').textContent=`Stored ${plan||'nothing'} · ${period}.`;
};
</script></body></html>
