# The M0 spikes, as their own workspace.
#
# These answered the questions in `PLAN.md` §3 "M0 spikes"; the numbers and
# conclusions they produced are recorded in `plans/spikes.md` and the design
# docs were written against them. They are kept because a measurement is worth
# more than the memory of a measurement, not because anything depends on them:
# no crate under `crates/` or `src-tauri` does.
#
# They are deliberately **outside** the product workspace (`exclude = ["spikes"]`
# in the root manifest) for two reasons. Compiling two extra Tauri apps on every
# CI run bought nothing. And none of them opted into `[lints] workspace = true`,
# so `unsafe_code = "deny"` — which `plans/05-platform.md` §1 rule 6 says holds
# workspace-wide — was never applied to them; `s6-panel` and `s7-webview` carry
# raw `unsafe` blocks. Rather than pretend otherwise, the policy claim now
# covers exactly what the product workspace contains, and these live here.
#
# They still build: `cargo build --workspace` from this directory, on macOS.

[workspace]
resolver = "3"
members = ["s1-nav", "s4-voice", "s5-sol", "s6-panel", "s7-render", "s7-webview"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
# The two product crates a spike may observe. Path dependencies rather than
# members: a spike reads them, it never changes them.
neo-cdp = { path = "../crates/neo-cdp" }
jev-nav = { path = "../crates/jev-nav" }
s7-render = { path = "s7-render" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "http2", "stream"] }
anyhow = "1"
tempfile = "3"
metalcraft = { version = "1.2.0", features = ["rig"] }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }

tauri = { version = "2.11.0", default-features = false, features = ["wry", "macos-private-api"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }

block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSImage", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSData", "NSArray", "NSEnumerator", "NSURL"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
core-graphics = "0.25"

audioadapter-buffers = "5.2"
cpal = "0.18"
earshot = "1.2"
hound = "3.5"
rtrb = "0.4"
rubato = "5"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
