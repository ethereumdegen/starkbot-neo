<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px system-ui;background:#15151b;color:#f7f7fb}.top{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #353541;background:#202028}.badge{color:#a99bff}.world-clip{position:absolute;inset:48px 220px 0 0;overflow:hidden}.world{position:absolute;transform-origin:0 0}.frame{position:absolute;left:260px;top:70px;width:594px;height:594px;background:#fff;box-shadow:0 16px 60px #0009}.frame iframe{width:1080px;height:1080px;border:0;transform:scale(.55);transform-origin:0 0;pointer-events:none}.overlay{position:absolute;inset:48px 220px 0 0;touch-action:none}.selection{position:absolute;border:2px solid #8f7cff;pointer-events:none;display:none}.handle{position:absolute;width:12px;height:12px;right:-7px;bottom:-7px;background:#fff;border:2px solid #8f7cff}.marquee{position:absolute;border:1px solid #8f7cff;background:#8f7cff22;display:none}.pin{position:absolute;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg);background:#ffcc66;border:2px solid #1a1a20}.rail{position:absolute;right:0;top:48px;bottom:0;width:220px;padding:16px;background:#202028;border-left:1px solid #353541}.rail input{width:100%}.status{margin-top:18px;color:#aaa;white-space:pre-line}
</style></head><body><div class="top"><strong>HYPERCANVAS</strong>&nbsp;<span class="badge">interactive spike</span></div><div class="world-clip"><div class="world"><div class="frame"><iframe sandbox="allow-same-origin"></iframe></div></div></div><div class="overlay"><div class="selection"><i class="handle"></i></div><div class="marquee"></div></div><aside class="rail"><label>Headline size<input id="headline" type="range" min="72" max="160" value="112"></label><button id="pin-tool">Pin comment</button><div class="status">Select · drag · resize
Space-drag pan
⌘-wheel zoom
Double-click text</div></aside><script>
const frame=document.querySelector('iframe'),world=document.querySelector('.world'),overlay=document.querySelector('.overlay'),selection=document.querySelector('.selection'),marquee=document.querySelector('.marquee');
const state={panX:0,panY:0,zoom:1,selected:null,tool:'select',mode:null,start:null,intents:[],scale:.55,frameX:260,frameY:70};
function renderWorld(){world.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;refreshSelection()}
function node(id){return frame.contentDocument?.querySelector(`[data-n="${id}"]`)}
function nodeRect(id){const r=node(id)?.getBoundingClientRect();if(!r)return null;return{x:state.panX+(state.frameX+r.x*state.scale)*state.zoom,y:state.panY+(state.frameY+r.y*state.scale)*state.zoom,w:r.width*state.scale*state.zoom,h:r.height*state.scale*state.zoom}}
function refreshSelection(){const r=nodeRect(state.selected);if(!r){selection.style.display='none';return}Object.assign(selection.style,{display:'block',left:`${r.x}px`,top:`${r.y}px`,width:`${r.w}px`,height:`${r.h}px`})}
function hit(x,y){const wx=(x-state.panX)/state.zoom-state.frameX,wy=(y-48-state.panY)/state.zoom-state.frameY;if(wx<0||wy<0)return null;const e=frame.contentDocument?.elementsFromPoint(wx/state.scale,wy/state.scale)?.find(e=>e.closest?.('[data-n]'));return e?.closest?.('[data-n]')?.dataset.n||null}
function setFrame(html){return new Promise(resolve=>{frame.onload=()=>{refreshSelection();resolve(true)};frame.srcdoc=html})}
overlay.onpointerdown=e=>{overlay.setPointerCapture(e.pointerId);state.start={x:e.clientX,y:e.clientY,panX:state.panX,panY:state.panY};if(state.tool==='pan'){state.mode='pan';return}const r=nodeRect(state.selected);if(r&&Math.abs(e.clientX-(r.x+r.w))<18&&Math.abs((e.clientY-48)-(r.y+r.h))<18){state.mode='resize';return}const id=hit(e.clientX,e.clientY);if(state.tool==='pin'&&id){state.intents.push({kind:'pin',node:id,anchor:[.5,.5],text:'Make this feel stronger'});state.tool='select';return}if(id){state.selected=id;state.mode='drag';refreshSelection()}else{state.selected=null;state.mode='marquee';marquee.style.display='block';refreshSelection()}};
overlay.onpointermove=e=>{if(!state.mode)return;const dx=e.clientX-state.start.x,dy=e.clientY-state.start.y;if(state.mode==='pan'){state.panX=state.start.panX+dx;state.panY=state.start.panY+dy;renderWorld()}else if(state.mode==='drag'){selection.style.transform=`translate(${dx}px,${dy}px)`}else if(state.mode==='resize'){selection.style.width=`${Math.max(20,parseFloat(selection.style.width)+e.movementX)}px`;selection.style.height=`${Math.max(20,parseFloat(selection.style.height)+e.movementY)}px`}else if(state.mode==='marquee'){Object.assign(marquee.style,{left:`${Math.min(state.start.x,e.clientX)}px`,top:`${Math.min(state.start.y,e.clientY)-48}px`,width:`${Math.abs(dx)}px`,height:`${Math.abs(dy)}px`})}};
overlay.onpointerup=e=>{const dx=e.clientX-state.start.x,dy=e.clientY-state.start.y;if(state.mode==='drag')state.intents.push({kind:'move',node:state.selected,dx:dx/state.zoom/state.scale,dy:dy/state.zoom/state.scale});if(state.mode==='resize'){const r=node(state.selected).getBoundingClientRect();state.intents.push({kind:'resize',node:state.selected,w:r.width+dx/state.zoom/state.scale,h:r.height+dy/state.zoom/state.scale})}if(state.mode==='marquee')state.intents.push({kind:'marquee',rect:[state.start.x,state.start.y,e.clientX,e.clientY]});selection.style.transform='';marquee.style.display='none';state.mode=null;refreshSelection()};
overlay.ondblclick=e=>{const id=hit(e.clientX,e.clientY);if(id)state.intents.push({kind:'edit',node:id})};
overlay.onwheel=e=>{if(!(e.metaKey||e.ctrlKey))return;e.preventDefault();const old=state.zoom,next=Math.max(.02,Math.min(8,old*Math.exp(-e.deltaY*.002)));state.panX=e.clientX-(e.clientX-state.panX)*next/old;state.panY=(e.clientY-48)-(e.clientY-48-state.panY)*next/old;state.zoom=next;renderWorld()};
document.getElementById('headline').oninput=e=>{frame.contentDocument.documentElement.style.setProperty('--k-headline',`${e.target.value}px`);refreshSelection()};document.getElementById('headline').onchange=e=>state.intents.push({kind:'knob',name:'--k-headline',value:`${e.target.value}px`});document.getElementById('pin-tool').onclick=()=>state.tool='pin';
window.canvasSpike={state,setFrame,nodeRect,setTool:t=>state.tool=t,drain:()=>state.intents.splice(0),apply:p=>{if(p.kind==='text')node(p.node).textContent=p.text;if(p.kind==='style'){if(p.value==null)node(p.node).style.removeProperty(p.property);else node(p.node).style.setProperty(p.property,p.value)}if(p.kind==='knob')frame.contentDocument.documentElement.style.setProperty(p.name,p.value);if(p.kind==='pin'){const r=nodeRect(p.node),pin=document.createElement('i');pin.className='pin';pin.dataset.pin=p.id;pin.title=p.text;pin.style.left=`${r.x+r.w*p.anchor[0]}px`;pin.style.top=`${r.y+r.h*p.anchor[1]}px`;overlay.append(pin)}refreshSelection()},directText:(id,text)=>state.intents.push({kind:'text',node:id,text}),ready:()=>!!frame.contentDocument?.body};
renderWorld();
</script></body></html>
