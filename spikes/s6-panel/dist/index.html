<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Starkbot NSPanel spike</title>
  <style>
    * { box-sizing: border-box }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: -apple-system, BlinkMacSystemFont, sans-serif }
    body { display: grid; place-items: center }
    .pill { width: calc(100% - 12px); height: calc(100% - 12px); border: 1px solid #ffffff38; border-radius: 999px; background: #171723eb; color: #fff; box-shadow: 0 18px 60px #0008; display: flex; align-items: center; gap: 14px; padding: 0 22px; cursor: pointer }
    .dot { width: 13px; height: 13px; border-radius: 50%; background: #8d73ff; box-shadow: 0 0 20px #8d73ff }
    .pill strong { font-size: 16px }
    .pill span:last-child { margin-left: auto; color: #bcb7d7; font-size: 13px }
    .ring { width: 270px; height: 180px; border: 6px solid #8d73ff; border-radius: 28px; box-shadow: 0 0 0 3px #fff8, 0 0 42px #8d73ffaa; pointer-events: none }
    .quick { width: calc(100% - 12px); height: calc(100% - 12px); border: 1px solid #ffffff45; border-radius: 22px; background: #171723f5; box-shadow: 0 24px 90px #000a; padding: 18px }
    .quick input { width: 100%; height: 100%; border: 0; outline: 0; background: transparent; color: white; font: 600 24px -apple-system, sans-serif }
    .quick input::placeholder { color: #8f89aa }
  </style>
</head>
<body>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const mode = new URLSearchParams(location.search).get('panel');
  if (mode === 'ring') {
    document.body.innerHTML = '<div class="ring" aria-label="click-through target ring"></div>';
  } else if (mode === 'quick') {
    document.body.innerHTML = '<label class="quick"><input autofocus placeholder="Ask Stark…" aria-label="Quick entry"></label>';
    const input = document.querySelector('input');
    input.addEventListener('input', () => invoke('quick_changed', { value: input.value }));
    addEventListener('focus', () => requestAnimationFrame(() => input.focus()));
  } else {
    document.body.innerHTML = '<button class="pill" type="button"><span class="dot"></span><strong>Stark is watching the target</strong><span>Click probe</span></button>';
    document.querySelector('button').addEventListener('click', () => invoke('pill_clicked'));
  }
</script>
</body>
</html>
